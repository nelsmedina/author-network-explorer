<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Background circle -->
  <circle cx="8" cy="8" r="7" fill="#4ecca3"/>
  <!-- Network nodes (3 connected circles) -->
  <!-- Center node -->
  <circle cx="8" cy="6" r="2" fill="#1a1a2e"/>
  <!-- Bottom-left node -->
  <circle cx="5" cy="11" r="1.8" fill="#1a1a2e"/>
  <!-- Bottom-right node -->
  <circle cx="11" cy="11" r="1.8" fill="#1a1a2e"/>
  <!-- Connecting lines -->
  <line x1="8" y1="6" x2="5" y2="11" stroke="#1a1a2e" stroke-width="1.2"/>
  <line x1="8" y1="6" x2="11" y2="11" stroke="#1a1a2e" stroke-width="1.2"/>
  <line x1="5" y1="11" x2="11" y2="11" stroke="#1a1a2e" stroke-width="1.2"/>
</svg>
